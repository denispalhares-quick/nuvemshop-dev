# Ambiente dev: `docker compose up`
#
#   frontend  recompila Tailwind + JS (frontend/src -> theme/static) a cada save
#   theme     `nuvemshop theme watch` envia cada arquivo alterado pro THEME_ID_HOMOLOG
#   mcp       MCP server em http://localhost:8080/mcp (health: /health)
#
# A loja NÃO roda local: o Twig é renderizado pela Nuvemshop. Veja o resultado
# na URL de preview:
#   docker compose exec theme sh -c 'nuvemshop theme preview --theme-id "$THEME_ID_HOMOLOG"'
#
# Pré-requisitos no host: .env preenchido e `nuvemshop theme authorize` já feito
# (gera theme/.nuvem, que entra no container pelo volume).

services:
  frontend:
    image: node:20-bookworm-slim
    working_dir: /repo/frontend
    volumes:
      - .:/repo
      # node_modules do container (binários linux do esbuild/tailwind),
      # separado do node_modules do macOS
      - frontend_node_modules:/repo/frontend/node_modules
    # --watch=always: sem TTY o watch do Tailwind encerra quando o stdin fecha
    # inject.mjs leva tailwind.css -> settings_data.json (css_code) e
    # app.js -> templates/layout/footer.json, que o `theme watch` envia sem fork
    command: >
      sh -c "npm ci &&
             npx tailwindcss -i src/css/main.css -o ../theme/static/css/tailwind.css &&
             node build.mjs &&
             node compose.mjs &&
             node inject.mjs &&
             (node build.mjs --watch &
              node compose.mjs --watch &
              node inject.mjs --watch &
              npx tailwindcss -i src/css/main.css -o ../theme/static/css/tailwind.css --watch=always)"
    healthcheck:
      test: ["CMD", "test", "-f", "/repo/theme/static/js/app.js"]
      interval: 5s
      retries: 60

  theme:
    build:
      context: ./docker
      dockerfile: theme-dev.Dockerfile
    working_dir: /repo/theme
    volumes:
      - .:/repo
    env_file: .env
    # se a CLI fizer alguma pergunta: docker compose attach theme
    tty: true
    stdin_open: true
    # Mostra o link de preview do homolog (como o link do workspace na VTEX) e inicia o watch.
    # Rever o link depois: docker compose logs theme | grep -A2 PREVIEW
    command:
      - sh
      - -c
      - |
        url=$$(nuvemshop theme preview --theme-id "$$THEME_ID_HOMOLOG" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | grep -Eo 'https?://[^ ]+' | tail -1)
        echo ""
        echo "=============================================================="
        echo "  PREVIEW DO HOMOLOG (abra logado no admin da loja)"
        if [ -n "$$url" ]; then
          echo "  $$url"
        else
          echo "  (link indisponível — confira o login da CLI: theme/.nuvem)"
          echo "  gerar: docker compose exec theme sh -c 'nuvemshop theme preview --theme-id \"$$THEME_ID_HOMOLOG\"'"
        fi
        echo "  tema: $$THEME_ID_HOMOLOG  |  cada arquivo salvo é enviado automaticamente"
        echo "=============================================================="
        echo ""
        exec nuvemshop theme watch --theme-id "$$THEME_ID_HOMOLOG" --no-browser
    depends_on:
      frontend:
        condition: service_healthy

  mcp:
    build: ./mcp-server
    env_file: .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8080"
      THEME_DIR: /repo/theme
    volumes:
      - .:/repo
    ports:
      - "8080:8080"

volumes:
  frontend_node_modules:
