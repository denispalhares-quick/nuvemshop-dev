<!--
  Figma "Shop From Top Categories" (frame 1:2) com a identidade da Quick Digital.
  Categorias reais da loja (API): Calças (/calcas/) e Camisas (/camisas/) + atalho para todos os produtos.
  Imagens: placeholders do Ipanema em design/assets/home/ — troque quando houver fotos das categorias.
  Ao criar categorias novas, adicione um <li> com o handle dela (Produtos > Categorias no admin).
  Desktop: itens de 132px alinhados à esquerda. Celular: rolagem horizontal com snap.
-->
<section class="container tw:py-10 tw:md:py-14" aria-label="Compre por categorias">
  <div class="tw:flex tw:items-end tw:justify-between tw:gap-4 tw:border-b tw:border-[#D1D5DB]">
    <h2 class="tw:m-0 tw:-mb-px tw:border-b-2 tw:border-brand tw:pb-3 tw:font-display tw:text-xl tw:font-black tw:text-[#000066] tw:md:text-2xl">
      Compre por <span class="tw:text-brand">categorias</span>
    </h2>
    <a href="/produtos/" class="tw:pb-3 tw:text-sm tw:font-semibold tw:text-[#1F2937] tw:no-underline tw:hover:text-brand">
      Ver tudo <span aria-hidden="true">›</span>
    </a>
  </div>

  <ul class="tw:m-0 tw:mt-8 tw:flex tw:list-none tw:snap-x tw:gap-5 tw:overflow-x-auto tw:p-0 tw:pb-2 tw:md:gap-10 tw:md:overflow-visible">
    <li class="tw:w-24 tw:shrink-0 tw:snap-start tw:md:w-32">
      <a href="/calcas/" class="tw:group tw:flex tw:flex-col tw:items-center tw:gap-3 tw:no-underline">
        <span class="tw:flex tw:aspect-square tw:w-full tw:items-center tw:justify-center tw:overflow-hidden tw:rounded-full tw:bg-[#F8F9FC] tw:ring-1 tw:ring-[#E5E7EB] tw:transition tw:group-hover:ring-2 tw:group-hover:ring-brand">
          <img src="asset:home/categoria-1.webp" alt="" width="132" height="132" loading="lazy" class="tw:size-full tw:object-cover">
        </span>
        <span class="tw:text-sm tw:font-semibold tw:text-[#1F2937] tw:group-hover:text-brand">Calças</span>
      </a>
    </li>
    <li class="tw:w-24 tw:shrink-0 tw:snap-start tw:md:w-32">
      <a href="/camisas/" class="tw:group tw:flex tw:flex-col tw:items-center tw:gap-3 tw:no-underline">
        <span class="tw:flex tw:aspect-square tw:w-full tw:items-center tw:justify-center tw:overflow-hidden tw:rounded-full tw:bg-[#F8F9FC] tw:ring-1 tw:ring-[#E5E7EB] tw:transition tw:group-hover:ring-2 tw:group-hover:ring-brand">
          <img src="asset:home/categoria-2.webp" alt="" width="132" height="132" loading="lazy" class="tw:size-full tw:object-cover">
        </span>
        <span class="tw:text-sm tw:font-semibold tw:text-[#1F2937] tw:group-hover:text-brand">Camisas</span>
      </a>
    </li>
    <li class="tw:w-24 tw:shrink-0 tw:snap-start tw:md:w-32">
      <a href="/produtos/" class="tw:group tw:flex tw:flex-col tw:items-center tw:gap-3 tw:no-underline">
        <span class="tw:flex tw:aspect-square tw:w-full tw:items-center tw:justify-center tw:overflow-hidden tw:rounded-full tw:bg-[#000066] tw:ring-1 tw:ring-[#000066] tw:transition tw:group-hover:ring-2 tw:group-hover:ring-brand">
          <span class="tw:font-display tw:text-3xl tw:font-black tw:text-white" aria-hidden="true">+</span>
        </span>
        <span class="tw:text-center tw:text-sm tw:font-semibold tw:text-[#1F2937] tw:group-hover:text-brand">Todos os produtos</span>
      </a>
    </li>
  </ul>
</section>
