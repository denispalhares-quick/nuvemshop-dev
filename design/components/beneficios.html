  Componente de exemplo: faixa de benefícios.

  Regras (sem fork, o HTML vai cru num block "Código" — sem Twig):
  - classes Tailwind SEMPRE com prefixo tw: (variantes depois: tw:md:grid-cols-3, tw:hover:underline)
  - cores/fontes do Brand Editor: tw:bg-brand, tw:text-brand-accent, tw:font-display…
  - imagens: src="asset:caminho/arquivo.webp" (design/assets)
  - interatividade: Alpine (x-data, x-show…); componentes registrados em frontend/src/js

-->
